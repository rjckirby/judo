<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tournament results for Judo & Ju-Jitsu Club Bern.">
  <title>JJCB Tournament Results</title>
  <link rel="stylesheet" href="./site/styles.css">
  <script type="module" src="./site/results.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <h1>Tournament results</h1>
      <a class="club" href="https://www.jjcb.ch/">
        <img src="./site/jjcb-logo.png" width="456" height="291" alt="Judo &amp; Ju-Jitsu Club Bern">
      </a>
    </div>
  </header>
  <main class="wrap">
    <form class="filters" role="search">
      <div class="results-toolbar">
        <fieldset id="group-by" class="segments" disabled>
          <legend class="sr">Group results by</legend>
          <label><input class="sr" type="radio" name="group" value="tournament" autocomplete="off" checked><span>Tournament</span></label>
          <label><input class="sr" type="radio" name="group" value="fighter" autocomplete="off"><span>Fighter</span></label>
        </fieldset>
        <button id="download" type="button" disabled>Download TSV</button>
      </div>
      <label>Fighter or tournament
        <input id="query" type="search" placeholder="Search results" disabled>
      </label>
      <label>Year
        <select id="year" disabled><option value="">All years</option></select>
      </label>
      <div class="filter-actions">
        <label class="include-unplaced">
          <input id="include-unplaced" type="checkbox" autocomplete="off" disabled>
          Include results with no placement
        </label>
      </div>
    </form>
    <p id="status" role="status">Loading results…</p>
    <div id="results"></div>
    <noscript>Enable JavaScript to browse tournament results.</noscript>
    <footer>
      <p>Results may include appearances for other clubs. A dash means no place was published.</p>
      <p>Results data provided by <a href="https://portal.judomanager.com/sjv/clubs/2219">JudoManager</a>.</p>
    </footer>
  </main>
</body>
</html>
