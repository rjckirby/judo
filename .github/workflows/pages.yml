name: Publish JJCB results

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jjcb-pages

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Bundle page assets
        run: |
          mkdir _site
          cp -R site _site/
          python3 - <<'PY'
          from pathlib import Path

          # Deliver the markup, styles, and script together so caches cannot mix releases.
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("site/styles.css").read_text(encoding="utf-8")
          js = Path("site/results.js").read_text(encoding="utf-8")
          html = html.replace('<link rel="stylesheet" href="./site/styles.css">', f"<style>\n{css}</style>")
          html = html.replace('<script type="module" src="./site/results.js"></script>', f'<script type="module">\n{js}</script>')
          Path("_site/index.html").write_text(html, encoding="utf-8")
          PY
      - name: Fetch JudoManager results
        run: python3 jjcb_results.py > _site/jjcb-results.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
